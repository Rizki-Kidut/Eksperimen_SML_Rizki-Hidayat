name: Eksperimen SML - Rizki Hidayat

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'heart_disease_uci_raw.csv'
      - 'Pre-processing/automate_Rizki_Hidayat.py'

  workflow_dispatch:
    inputs:
      target_column:
        description: 'Nama kolom target'
        required: true
        default: 'num'

permissions:
  contents: write

jobs:
  preprocess:
    name: Run Preprocessing Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Setup Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Validasi Dataset
        run: |
          if [ ! -f "heart_disease_uci_raw.csv" ]; then
            echo "❌ ERROR: Dataset tidak ditemukan di root folder"
            exit 1
          fi
          echo "✅ Dataset ditemukan"
          wc -l heart_disease_uci_raw.csv

      - name: 📁 Siapkan Folder Output
        run: mkdir -p Pre-processing

      - name: ⚙️ Run Preprocessing
        run: |
          python Pre-processing/automate_Rizki_Hidayat.py \
            --input heart_disease_uci_raw.csv \
            --target ${{ github.event.inputs.target_column || 'num' }} \
            --model Pre-processing/preprocessor.joblib \
            --train_path Pre-processing/heart_disease_train.csv \
            --test_path  Pre-processing/heart_disease_test.csv

      - name: 🔎 Verifikasi Output
        run: |
          echo "📁 Isi folder Pre-processing:"
          ls -lh Pre-processing/
          if [ ! -f "Pre-processing/heart_disease_train.csv" ]; then
            echo "❌ ERROR: CSV Train tidak ditemukan!"
            exit 1
          fi
          if [ ! -f "Pre-processing/heart_disease_test.csv" ]; then
            echo "❌ ERROR: CSV Test tidak ditemukan!"
            exit 1
          fi
          echo "✅ Semua output ditemukan"

      - name: 💾 Commit CSV ke Repo
        env:
          GIT_USER_NAME:  ${{ secrets.GIT_USERNAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_EMAIL }}
          GITHUB_ACTOR:   ${{ github.actor }}
        run: |
          NAME="${GIT_USER_NAME:-$GITHUB_ACTOR}"
          EMAIL="${GIT_USER_EMAIL:-${GITHUB_ACTOR}@users.noreply.github.com}"

          git config user.name  "$NAME"
          git config user.email "$EMAIL"

          git add Pre-processing/heart_disease_train.csv
          git add Pre-processing/heart_disease_test.csv
          
          if git diff --staged --quiet; then
            echo "⏭️  Tidak ada perubahan, skip commit."
          else
            git commit -m "ci: update preprocessed dataset [run #${{ github.run_number }}]"
            git push
            echo "✅ CSV Train & Test berhasil di-commit ke repo"
          fi
