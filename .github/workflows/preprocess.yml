name: Heart Disease Preprocessing Pipeline

on:
  # ── Trigger 1: Otomatis jalan saat ada push ke branch main/master
  push:
    branches:
      - main
      - master
    paths:
      - 'heart_disease_uci_raw.csv'   # hanya jalan jika dataset berubah
      - 'Pre-processing/automate_Rizki_Hidayat.py'             # atau jika script berubah

  # ── Trigger 2: Bisa dijalankan manual dari tab Actions di GitHub
  workflow_dispatch:
    inputs:
      target_column:
        description: 'Nama kolom target'
        required: true
        default: 'num'
        
permissions: 
  contents: write

jobs:
  preprocess:
    name: Run Preprocessing Pipeline
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout repository
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0             # ambil full history agar git push tidak konflik

      # ── Step 2: Setup Python
      - name: 🐍 Setup Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
          cache: 'pip'              # cache pip supaya install lebih cepat

      # ── Step 3: Install dependencies
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 4: Validasi dataset ada
      - name: 🔍 Validasi Dataset
        run: |
          if [ ! -f "heart_disease_uci_raw.csv" ]; then
            echo "❌ ERROR: Dataset tidak ditemukan di folder data/"
            exit 1
          fi
          echo "✅ Dataset ditemukan"
          echo "📊 Info dataset:"
          wc -l heart_disease_uci_raw.csv

      # ── Step 5: Jalankan preprocessing
      - name: ⚙️ Run Preprocessing
        run: |
          python Pre-processing/automate_Rizki_Hidayat.py \
            --input heart_disease_uci_raw.csv \
            --target ${{ github.event.inputs.target_column || 'num' }} \
            --model Pre-processing/preprocessor.joblib \
            --header Pre-processing/heart_disease_uci_preprocessed.csv
            
      # ── Step 6: Commit & Push hasil output ke Repo
      - name: 💾 Commit Hasil Preprocessing ke Repo
        run: |
          git config user.name "${{ secrets.GIT_USERNAME }}"
          git config user.email "${{ secrets.GIT_EMAIL }}"

          git add Pre-processing/preprocessor.joblib
          git add Pre-processing/heart_disease_uci_preprocessing.csv

          # Hanya commit jika ada perubahan (hindari empty commit)
          if git diff --staged --quiet; then
            echo "⏭️  Tidak ada perubahan pada output, skip commit."
          else
            git commit -m "ci: update preprocessing output [run #${{ github.run_number }}]"
            git push
            echo "✅ Output berhasil di-commit ke repo"
          fi

      # ── Step 7: Upload hasil sebagai artifact GitHub
      - name: 📤 Upload Hasil Preprocessing
        uses: actions/upload-artifact@v4
        with:
          name: preprocessing-outputs-${{ github.run_number }}
          path: |
            Pre-processing/preprocessor.joblib
            Pre-processing/heart_disease_uci_preprocessing.csv
