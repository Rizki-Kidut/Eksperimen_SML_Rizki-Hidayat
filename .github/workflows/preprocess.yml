name: Heart Disease Preprocessing Pipeline

on:
  # ── Trigger 1: Otomatis jalan saat ada push ke branch main/master
  push:
    branches:
      - main
      - master
    paths:
      - 'heart_disease_uci_raw.csv'   # hanya jalan jika dataset berubah
      - 'preprocess_heart.py'              # atau jika script berubah

  # ── Trigger 2: Bisa dijalankan manual dari tab Actions di GitHub
  workflow_dispatch:
    inputs:
      target_column:
        description: 'Nama kolom target'
        required: true
        default: 'num'

jobs:
  preprocess:
    name: Run Preprocessing Pipeline
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout repository
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      # ── Step 2: Setup Python
      - name: 🐍 Setup Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
          cache: 'pip'              # cache pip supaya install lebih cepat

      # ── Step 3: Install dependencies
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 4: Validasi dataset ada
      - name: 🔍 Validasi Dataset
        run: |
          if [ ! -f "heart_disease_uci_raw.csv" ]; then
            echo "❌ ERROR: Dataset tidak ditemukan di folder data/"
            exit 1
          fi
          echo "✅ Dataset ditemukan"
          echo "📊 Info dataset:"
          wc -l heart_disease_uci_raw.csv

      # ── Step 5: Jalankan preprocessing
      - name: ⚙️ Run Preprocessing
        run: |
          python preprocessing/automate_Rizki_Hidayat.py \
            --input data/heart_disease_uci_raw.csv \
            --target ${{ github.event.inputs.target_column || 'num' }} \
            --model preprocessing/preprocessor.joblib \
            --header preprocessing/heart_disease_uci_preprocessed.csv

      # ── Step 6: Upload hasil sebagai artifact GitHub
      - name: 📤 Upload Hasil Preprocessing
        uses: actions/upload-artifact@v4
        with:
          name: preprocessing-outputs-${{ github.run_number }}
          path: |
            preprocessing/preprocessor.joblib
            preprocessing/heart_disease_uci_preprocessing.csv
